<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0e3560">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Connect">
<title>Connect</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,700;6..12,800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<style>#app{padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}.top{margin-top:calc(-1*env(safe-area-inset-top));padding-top:calc(10px + env(safe-area-inset-top))}</style>
</head>
<body>
<div id="app"><div class="login"><div class="empty" style="color:#fff">Carregando…</div></div></div>
<input type="file" id="fmedia" accept="image/*,video/*,application/pdf,.pdf,.doc,.docx,.xls,.xlsx,.ppt,.pptx,.txt,.csv,.zip,.pages,.numbers,.key" multiple hidden>
<input type="file" id="faudio" accept="audio/*" hidden>
<script type="module" src="app.js"></script>
<script>
if ('serviceWorker' in navigator) addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
</script>
</body>
</html>
